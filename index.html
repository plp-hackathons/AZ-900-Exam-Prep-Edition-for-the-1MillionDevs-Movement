<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ-900 Quiz Coach (Unofficial)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--card:#faf8f5;--tx:#1f1b16;--mu:#6b6258;--ac:#b4531a;--ok:#1a7f4b;--no:#b42318;--bd:#e7e1d8}
:root[data-theme="dark"]{--bg:#141210;--card:#1d1a17;--tx:#f3eee8;--mu:#a89e92;--ac:#f0a06b;--ok:#4cc38a;--no:#ff8a7a;--bd:#332e28}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.15rem;margin:0 0 12px}
.mu{color:var(--mu);font-size:.9rem}
.tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--bd);color:var(--mu);margin-bottom:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px;text-align:left;width:100%;margin-bottom:8px}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}
.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.no{border-color:var(--no)!important;background:color-mix(in srgb,var(--no) 15%,var(--card))}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--ac)}
.why{border-left:4px solid var(--ac);padding:8px 12px;margin:12px 0;background:var(--bg);border-radius:6px;font-size:.95rem}
.top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);margin-bottom:8px}
footer{font-size:.8rem;color:var(--mu);text-align:center;margin-top:20px}
</style></head><body><main id="app"></main>
<script>
const D=["Cloud Concepts","Azure Architecture & Services","Management & Governance","Twin Drills"];
// [domain, question, options, correctIndex, explanation]
const Q=[
[0,"A company uses IaaS virtual machines. Who is responsible for patching the guest operating system?",["The customer","The cloud provider","Both equally, always","Neither"],0,"In IaaS the provider runs the physical hardware and hypervisor, but you manage the OS, apps and data. This is the shared responsibility model."],
[0,"A startup stops buying servers and pays monthly for cloud usage instead. This shifts spending from:",["OpEx to CapEx","CapEx to OpEx","Fixed to capital","Variable to fixed"],1,"Buying hardware up front is capital expenditure (CapEx). Pay-as-you-go cloud is operational expenditure (OpEx)."],
[0,"An e-commerce site automatically adds servers during a sale and removes them afterwards. This is:",["Elasticity","Geo-distribution","Disaster recovery","Fault isolation"],0,"Elasticity means resources scale out and in automatically with demand, so you do not pay for idle capacity."],
[0,"A bank keeps customer records in its own data centre but runs its mobile app front end in Azure. Which model is this?",["Public cloud","Private cloud","Hybrid cloud","Community cloud"],2,"Hybrid cloud combines on-premises or private infrastructure with a public cloud."],
[0,"Which term describes a service that stays accessible even when some components fail?",["High availability","Elasticity","Agility","Scalability"],0,"High availability is about uptime and resilience, often through redundancy across zones or regions."],
[0,"A school staff team signs in to a web-based email and calendar service. They install and manage nothing. Which model is this?",["IaaS","PaaS","SaaS","On-premises"],2,"SaaS delivers a finished application over the internet. The provider manages everything underneath."],
[0,"Which statement best describes the consumption-based pricing model?",["Pay a fixed yearly licence","Pay only for the resources you use","Prepay for hardware","Pay only at the end of the contract"],1,"Consumption-based pricing means you are billed for what you actually use, with no large up-front cost."],
[0,"You write code that runs only when triggered, and the platform manages servers and scaling. You are billed per execution. This is:",["Serverless computing","A dedicated host","A traditional VM","Private cloud"],0,"Serverless hides the servers. You focus on code and pay per execution."],
[1,"Which Azure feature refers to physically separate datacenters inside a single region?",["Availability zones","Resource groups","Management groups","Subscriptions"],0,"Availability zones are separate locations with independent power, cooling and networking. Think of a service like M-Pesa staying up even if one building fails."],
[1,"What is an Azure resource group?",["A billing invoice","A logical container for related resources","A physical datacenter","A type of VM"],1,"Resource groups hold related resources so you can deploy, manage and delete them together."],
[1,"Which service is best for storing unstructured data such as images and videos?",["Azure Blob Storage","Azure SQL Database","Azure Virtual Network","Azure Policy"],0,"Blob Storage is object storage for large amounts of unstructured data."],
[1,"Which service lets Azure resources communicate securely with each other over a private network?",["Azure Virtual Network","Azure Monitor","Azure Advisor","Azure Blueprints"],0,"A virtual network (VNet) provides isolated, private networking for Azure resources."],
[1,"Which service runs small pieces of code in response to events, without managing servers?",["Azure Functions","Azure Virtual Machines","Azure Backup","Azure Arc"],0,"Azure Functions is event-driven serverless compute."],
[1,"Which database service is a globally distributed NoSQL database?",["Azure Cosmos DB","Azure SQL Database","Azure Files","Azure Bastion"],0,"Cosmos DB offers multi-region distribution and low latency for NoSQL workloads."],
[1,"A company wants a private connection from its office to Azure that does not travel over the public internet. Which service fits?",["Azure ExpressRoute","Azure DNS","Azure CDN","Azure Bastion"],0,"ExpressRoute provides a private, dedicated connection between on-premises networks and Azure."],
[1,"Which service provides cloud-based identity and access management, including sign-in and multifactor authentication?",["Microsoft Entra ID","Azure Cost Management","Azure Service Health","Azure Storage"],0,"Microsoft Entra ID (formerly Azure Active Directory) handles authentication and access to resources and apps."],
[2,"You want to enforce a rule that resources can only be created in approved regions. Which service helps?",["Azure Policy","Azure Monitor","Azure Advisor","Azure CDN"],0,"Azure Policy creates and enforces rules and evaluates compliance across resources."],
[2,"Which feature prevents accidental deletion of an important resource?",["Resource lock","Tag","Budget alert","Availability set"],0,"A resource lock (CanNotDelete or ReadOnly) stops changes or deletion, even by users with permissions."],
[2,"Which tool helps you track, analyse and set budgets for your Azure spending?",["Microsoft Cost Management","Azure Policy","Azure Monitor","Azure Arc"],0,"Cost Management lets you analyse costs, set budgets and get alerts."],
[2,"Before deploying, you want to estimate the monthly cost of a planned solution. Which tool do you use?",["Pricing calculator","Azure Advisor","Service Health","Azure Blueprints"],0,"The Azure Pricing calculator estimates cost for services you plan to use. The TCO calculator compares against on-premises."],
[2,"Which service collects and analyses metrics and logs to help you monitor performance?",["Azure Monitor","Azure Policy","Azure DNS","Azure Lighthouse"],0,"Azure Monitor gathers telemetry from apps and resources and supports alerts and dashboards."],
[2,"Which service gives personalised recommendations to improve cost, security, reliability and performance?",["Azure Advisor","Azure Arc","Azure Bastion","Azure Backup"],0,"Azure Advisor analyses your resources and suggests best-practice improvements."],
[2,"Which service lets you manage on-premises and other cloud servers from Azure?",["Azure Arc","Azure Functions","Azure Cosmos DB","Azure Blob Storage"],0,"Azure Arc extends Azure management and governance to resources running outside Azure."],
[2,"Your finance team wants costs grouped by department across many resources. What should you apply?",["Tags","Locks","Availability zones","Virtual networks"],0,"Tags are name-value metadata you attach to resources, useful for cost reporting and organisation."],
[3,"A company wants to require multifactor authentication whenever users sign in from an unfamiliar country. Which feature fits?",["Conditional Access","Azure RBAC","Resource locks","Azure Policy"],0,"Conditional Access decides whether and how someone can sign in (MFA, location, device). RBAC only controls what they can do after they are in.","Door vs keys: sign-in conditions are the door."],
[3,"A junior admin must be able to restart virtual machines in one resource group, but not delete them. Which feature grants that?",["Azure RBAC","Conditional Access","Azure Policy","Tags"],0,"Azure role-based access control assigns roles that define what actions a person can take on which scope. Conditional Access cannot grant permissions.","Door vs keys: actions inside Azure are the keys."],
[3,"A small branch office needs an encrypted, low-cost connection to Azure over the public internet. Which service fits?",["VPN Gateway","ExpressRoute","Azure Bastion","Azure DNS"],0,"VPN Gateway sends encrypted traffic over the public internet. ExpressRoute is a private, dedicated connection that does not use the internet.","Over the internet = VPN. Private and dedicated = ExpressRoute."],
[3,"An administrator wants to open RDP or SSH to a VM from the browser without giving the VM a public IP address. Which service fits?",["Azure Bastion","VPN Gateway","ExpressRoute","Network security group"],0,"Bastion connects a person to a VM securely through the portal. VPN Gateway and ExpressRoute connect whole networks.","Bastion = a person to a VM. VPN and ExpressRoute = network to network."],
[3,"You need resources in two different Azure virtual networks to communicate privately. What do you use?",["VNet peering","Point-to-site VPN","Azure Bastion","Local network gateway"],0,"VNet peering joins two virtual networks over the Microsoft backbone. Point-to-site VPN connects a single device to a VNet.","Peering joins VNets. Point-to-site connects one device."],
[3,"Which service is a managed, stateful firewall that protects an entire virtual network with central rules?",["Azure Firewall","Network security group","Azure DNS","Availability set"],0,"Azure Firewall is a managed, stateful firewall service. A network security group (NSG) filters traffic with basic allow and deny rules on subnets or NICs.","Basic allow/deny rules = NSG. Managed, whole-network firewall = Azure Firewall."],
[3,"Which option protects a workload from the failure of an entire datacenter within a region?",["Availability zones","Availability set","Resource group","Tags"],0,"Zones are separate datacenters in one region. An availability set only spreads VMs across racks inside one datacenter.","Rack = availability set. Datacenter = zone. Whole region = region pair."],
[3,"Which storage redundancy option keeps copies in a second region to survive a regional outage?",["GRS","LRS","ZRS","Hot access tier"],0,"Geo-redundant storage (GRS) replicates data to another region. LRS stays in one datacenter and ZRS spans zones within one region.","Z = zones. G = geo, another region."],
[3,"Where do you check for an Azure-wide incident affecting services in your region?",["Service Health","Resource Health","Azure Advisor","Azure Policy"],0,"Service Health reports Azure service issues and planned maintenance that may affect you. Resource Health reports on your specific resources.","Service Health = Azure-wide. Resource Health = your own resource."],
[3,"You want to know whether one specific virtual machine is currently healthy and available. Which tool shows that?",["Resource Health","Service Health","Azure Advisor","Cost Management"],0,"Resource Health shows the availability of an individual resource, such as one VM. Advisor gives recommendations, not live status.","Resource Health = your specific resource."],
[3,"A team needs to orchestrate, scale and manage many containers across a cluster. Which service fits?",["Azure Kubernetes Service","Azure Container Instances","Azure Functions","Azure Blob Storage"],0,"AKS is a managed Kubernetes service for orchestrating many containers. ACI runs simple containers without orchestration, and Functions is serverless code.","ACI = simple container. AKS = orchestrates many."],
[3,"You need to route web traffic by URL path and add a web application firewall (WAF). Which service fits?",["Application Gateway","Azure Load Balancer","Azure Bastion","ExpressRoute"],0,"Application Gateway works at Layer 7 (HTTP, URLs) and supports WAF. Load Balancer works at Layer 4 using IPs and ports.","Layer 7 = URLs and WAF. Layer 4 = IPs and ports."]
];
const app=document.getElementById("app");
let S;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const foot='<footer><button style="width:auto;display:inline-block" onclick="theme()">Switch light / dark</button><br>Unofficial study tool. Not affiliated with or endorsed by Microsoft. All questions are original and based on the public AZ-900 skills outline.</footer>';
function load(){try{return JSON.parse(localStorage.getItem('az9')||'{}')}catch(e){return {}}}
function save(o){try{localStorage.setItem('az9',JSON.stringify(o))}catch(e){}}
function rec(id,ok){const o=load();const s=o[id]||[0,0];s[0]++;if(ok)s[1]++;o[id]=s;save(o)}
function prog(){const o=load(),ids=Object.keys(o).filter(i=>Q[i]);if(!ids.length)return '';
const weak=ids.filter(i=>o[i][1]/o[i][0]<0.7).map(Number);
const rows=D.map((d,k)=>{let a=0,c=0;ids.forEach(i=>{if(Q[i][0]==k){a+=o[i][0];c+=o[i][1]}});if(!a)return '';const p=Math.round(c/a*100);return '<div><b>'+d+'</b> <span class="mu">'+p+'% over '+a+' answers</span><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join('');
return '<h2>Your readiness so far</h2><p class="mu">Saved on this device only.</p>'+rows+(weak.length?'<button class="pri" onclick="start(-1,['+weak+'])">Drill my '+weak.length+' weak spots</button>':'')+'<hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">'}
const K="az900coach.v1";
let P={q:{},h:[]};
try{const r=localStorage.getItem(K);if(r)P=JSON.parse(r)}catch(e){}
function persist(){try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}}
function rec(id,ok){const s=P.q[id]||{c:0,w:0};ok?s.c++:s.w++;s.l=ok?1:0;P.q[id]=s;persist()}
function save(p){P.h.push(p);P.h=P.h.slice(-10);persist()}
function weakIds(){return Object.keys(P.q).filter(k=>P.q[k].l===0).map(Number)}
function resetP(){P={q:{},h:[]};persist();home()}
function tracker(){
 const seen=Object.keys(P.q);
 if(!seen.length)return "";
 const ok=seen.filter(k=>P.q[k].l===1).length,pct=Math.round(ok/Q.length*100),w=weakIds();
 let h='<div class="why"><b>Your readiness: '+pct+'%</b> <span class="mu">('+ok+' of '+Q.length+' questions mastered, based on your latest answer to each)</span>'+
 D.map((d,i)=>{const ids=Q.map((q,n)=>n).filter(n=>Q[n][0]==i);const m=ids.filter(n=>P.q[n]&&P.q[n].l===1).length;const p=Math.round(m/ids.length*100);return '<div style="margin-top:8px"><span class="mu">'+d+' '+p+'%</span><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")+
 (P.h.length?'<div class="mu">Recent sessions: '+P.h.join("% → ")+'%</div>':'')+'</div>';
 if(w.length)h+='<button class="pri" onclick="start(-1,weakIds())">Practice my '+w.length+' weak questions</button>';
 return h+'<button onclick="resetP()">Reset my progress</button>';
}
function home(){
 app.innerHTML='<button onclick="hub()">&larr; Study modes</button><div class="card"><h1>Smart Quiz</h1><p class="mu">Unofficial practice for Azure Fundamentals. Instant explanations for every answer, then a readiness score by topic.</p>'+
 prog()+''+tracker()+'<button class="pri" onclick="start(-1)">All topics ('+Q.length+' questions)</button>'+
 D.map((d,i)=>'<button onclick="start('+i+')">'+d+' <span class="mu">('+Q.filter(q=>q[0]==i).length+')</span></button>').join("")+'</div>'+foot;
}
function start(d,list){
 const pool=list||Q.map((q,i)=>i).filter(i=>d<0||Q[i][0]==d);
 S={ids:sh(pool),i:0,res:[],d};question();
}
function question(){
 const id=S.ids[S.i],q=Q[id];S.ord=sh([0,1,2,3]);S.done=false;
 app.innerHTML='<div class="top"><span>Question '+(S.i+1)+' of '+S.ids.length+'</span><span>'+S.res.filter(r=>r.ok).length+' correct</span></div>'+
 '<div class="bar"><i style="width:'+(S.i/S.ids.length*100)+'%"></i></div>'+
 '<div class="card"><span class="tag">'+D[q[0]]+'</span><h2>'+q[1]+'</h2>'+(HT(id)?'<button onclick="hint(this)">Show trigger-word hint</button><div id="hn"></div>':'')+'<div id="opts">'+
 S.ord.map((o,k)=>'<button onclick="pick('+k+')">'+q[2][o]+'</button>').join("")+'</div><div id="fb"></div></div>'+foot;
}
const H=["IaaS + guest OS: you manage everything above the hypervisor.","Stops buying servers, pays monthly = OpEx. Buying = CapEx.","Automatically adds and removes = elasticity. Deploying quickly = agility.","Own data centre + cloud together = hybrid.","Stays accessible despite failures = high availability.","Just sign in, install and manage nothing = SaaS.","Pay only for what you use = consumption-based.","Runs when triggered, billed per execution = serverless.","Separate datacenters inside one region = availability zones.","Logical container for related resources = resource group.","Unstructured data, images, video = Blob Storage.","Private network between Azure resources = Virtual Network.","Runs in response to events, no servers to manage = Functions.","Globally distributed NoSQL = Cosmos DB.","Private, not over the public internet = ExpressRoute.","Identity, sign-in, MFA = Microsoft Entra ID.","Enforce rules about what is allowed = Azure Policy.","Prevent accidental deletion = resource lock.","Track spending and budgets = Cost Management.","Estimate cost before deploying = Pricing calculator.","Metrics and logs = Azure Monitor.","Personalised recommendations = Azure Advisor.","Manage on-premises and other clouds from Azure = Azure Arc.","Group costs by department, label resources = tags."];
function HT(i){return Q[i][5]||H[i]||""}
function hint(b){document.getElementById("hn").innerHTML='<div class="why"><b>Hint:</b> '+HT(S.ids[S.i])+'</div>';b.remove()}
function pick(k){
 if(S.done)return;S.done=true;
 const id=S.ids[S.i],q=Q[id],ok=S.ord[k]==q[3];
 S.res.push({id,ok});rec(id,ok);rec(id,ok);
 const b=document.querySelectorAll("#opts button");
 b.forEach((el,n)=>{if(S.ord[n]==q[3])el.classList.add("ok");else if(n==k)el.classList.add("no")});
 const last=S.i==S.ids.length-1;
 document.getElementById("fb").innerHTML='<div class="why"><b>'+(ok?"Correct":"Not quite")+'.</b> '+q[4]+'</div>'+
 '<button class="pri" onclick="next()">'+(last?"See my readiness":"Next question")+'</button>';
}
function next(){S.i++;S.i<S.ids.length?question():results()}
function results(){
 const tot=S.res.filter(r=>r.ok).length,pct=Math.round(tot/S.res.length*100);save(pct);
 const by=D.map((d,i)=>{const r=S.res.filter(x=>Q[x.id][0]==i);return{d,n:r.length,c:r.filter(x=>x.ok).length}}).filter(x=>x.n);
 const label=pct>=80?"Looking exam-ready. Keep sharpening.":pct>=60?"Getting close. Focus on the weak topics below.":"Keep going. Revise the topics below, then retry.";
 const weak=by.slice().sort((a,b)=>a.c/a.n-b.c/b.n).filter(x=>x.c<x.n);
 const miss=S.res.filter(r=>!r.ok);
 app.innerHTML='<div class="card"><h1>'+pct+'% ready</h1><p class="mu">'+tot+' of '+S.res.length+' correct. '+label+' (Note: the real exam pass mark is 700/1000, scored differently.)</p>'+
 by.map(x=>{const p=Math.round(x.c/x.n*100);return '<div><b>'+x.d+'</b> <span class="mu">'+p+'% ('+x.c+'/'+x.n+')</span><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")+'</div>'+
 (weak.length?'<div class="card"><h2>Revise these first</h2>'+weak.map(x=>'<p>• '+x.d+'</p>').join("")+miss.map(r=>'<div class="why"><b>'+Q[r.id][1]+'</b><br>Answer: '+Q[r.id][2][Q[r.id][3]]+'. '+Q[r.id][4]+'</div>').join("")+'</div>':'<div class="card"><h2>Perfect round!</h2><p class="mu">Try another topic or retake all questions.</p></div>')+
 (miss.length?'<button class="pri" onclick="start(0,'+JSON.stringify(miss.map(r=>r.id))+')">Retry missed questions</button>':'')+
 '<button onclick="home()">Back to topics</button>'+foot;
}
function theme(){const r=document.documentElement,d=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=d;try{localStorage.setItem("az900theme",d)}catch(e){}}
try{const t=localStorage.getItem("az900theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
P.f=P.f||{};
function hub(){app.innerHTML='<div class="card"><h1>AZ-900 Study Coach</h1><p class="mu">Choose how you want to revise today.</p><button onclick="home()"><b>Smart Quiz</b><br><span class="mu">Practice questions, instant explanations, readiness by topic.</span></button><button onclick="flash()"><b>Flashcard Coach</b><br><span class="mu">Build memory: recall, reveal, rate. Missed cards return sooner.</span></button><button onclick="buddy()"><b>Study Buddy</b><br><span class="mu">Concepts in simple words, with African examples and Kiswahili.</span></button></div>'+foot}
const DAY=864e5,IV=[0,1,3,7,14];let FS;
function fdue(){const n=Date.now();P.f=P.f||{};return Q.map((q,i)=>i).filter(i=>!P.f[i]||P.f[i].d<=n)}
function flash(){const due=fdue(),f=P.f||{},m=Object.keys(f).filter(k=>f[k].b>=4).length;app.innerHTML='<button onclick="hub()">&larr; Study modes</button><div class="card"><h1>Flashcard Coach</h1><p class="mu">See the prompt, recall the answer, then rate yourself. Cards you miss come back sooner. Cards you know come back later. Progress stays on this device.</p><p><b>'+due.length+'</b> cards due now &middot; <b>'+m+'</b> of '+Q.length+' well remembered</p>'+(due.length?'<button class="pri" onclick="fstart()">Start review ('+Math.min(due.length,12)+' cards)</button>':'<p class="mu">Nothing due right now.</p><button class="pri" onclick="fstart(true)">Study ahead</button>')+'</div>'+foot}
function fstart(a){FS={ids:sh(a?Q.map((q,i)=>i):fdue()).slice(0,12),i:0,n:0,ok:0};fcard()}
function fcard(){if(FS.i>=FS.ids.length){app.innerHTML='<div class="card"><h1>Session done</h1><p>'+FS.ok+' of '+FS.n+' cards remembered.</p><p class="mu">Missed cards return in about 10 minutes. Hard cards tomorrow.</p><button class="pri" onclick="flash()">Back to Flashcards</button></div>'+foot;return}const q=Q[FS.ids[FS.i]];app.innerHTML='<div class="top"><span>Card '+(FS.i+1)+' of '+FS.ids.length+'</span><span>'+D[q[0]]+'</span></div><div class="bar"><i style="width:'+(FS.i/FS.ids.length*100)+'%"></i></div><div class="card"><h2>'+q[1]+'</h2><p class="mu">Say the answer to yourself first.</p><div id="fa"><button class="pri" onclick="freveal()">Reveal answer</button></div></div>'+foot}
function freveal(){const id=FS.ids[FS.i],q=Q[id];document.getElementById("fa").innerHTML='<div class="why"><b>'+q[2][q[3]]+'</b><br>'+q[4]+'<br><span class="mu">Hint: '+HT(id)+'</span></div><button class="ok" onclick="frate(2)">Got it</button><button onclick="frate(1)">Hard</button><button class="no" onclick="frate(0)">Missed it</button>'}
function frate(r){const id=FS.ids[FS.i];P.f=P.f||{};const c=P.f[id]||{b:0},n=Date.now();if(r==0){c.b=0;c.d=n+6e5}else if(r==1){c.b=Math.max(c.b,1);c.d=n+DAY}else{c.b=Math.min(c.b+1,4);c.d=n+IV[c.b]*DAY}P.f[id]=c;persist();FS.n++;if(r>0)FS.ok++;FS.i++;fcard()}
const B=[
["Cloud computing","Renting computing power, storage and software over the internet and paying for what you use, instead of buying and running your own servers.","A Nairobi shop moves its online store to the cloud. Before payday week it rents more capacity, afterwards it scales back, and it never buys a server.","Kutumia kompyuta, hifadhi na programu kupitia mtandao na kulipia unachotumia tu.","Cloud is more than storing files online. It includes computing, networking and services you can scale.",0],
["Elasticity","The system grows and shrinks automatically as demand changes.","A mobile-money style service sees payment spikes on salary day. Capacity rises for the rush and drops afterwards, so you pay only for what is needed.","Mfumo hujiongeza au kupungua wenyewe kulingana na mahitaji.","Elasticity is automatic scaling. Agility is deploying quickly. High availability is staying up through failures.",0],
["IaaS, PaaS and SaaS","Three levels of who manages what. The more the provider manages, the less you do.","IaaS is renting an empty plot and building everything yourself. PaaS is renting a furnished stall, so you just sell. SaaS is buying from a ready shop.","IaaS: unasimamia mfumo wa uendeshaji na programu; PaaS: unasimamia programu yako tu; SaaS: unatumia tu.","In IaaS the customer manages the OS. In PaaS and SaaS the provider does.",0],
["Availability zones and region pairs","Zones are separate datacenters inside one region. A region pair links two regions far apart for disaster recovery.","A hospital app survives one building losing power because it runs across zones. A county portal backs up to a paired region in case a whole region fails.","Eneo la upatikanaji ni vituo tofauti vya data ndani ya eneo moja; jozi ya maeneo ni maeneo mawili ya mbali kwa uokoaji wa maafa.","Availability set: rack level. Zone: datacenter level. Region pair: whole region.",1],
["Conditional Access vs RBAC","Conditional Access decides if and how you can sign in. RBAC decides what you can do after you are in.","A bank asks staff for MFA when they sign in from a new country (Conditional Access). A junior admin can restart VMs but not delete them (RBAC).","Conditional Access ni mlango (masharti ya kuingia); RBAC ni funguo (unachoruhusiwa kufanya ndani).","Door vs keys. They solve different problems and work together.",1],
["VPN Gateway vs ExpressRoute","VPN Gateway sends encrypted traffic over the public internet. ExpressRoute is a private, dedicated connection.","A small branch office uses a VPN for a low-cost link. A large retailer moving lots of data daily chooses a private line for steadier performance.","VPN hupitisha data iliyosimbwa kwenye intaneti ya umma; ExpressRoute ni njia binafsi maalum.","Bastion connects a person to a VM. VPN and ExpressRoute connect networks.",1],
["Azure Policy vs resource locks","Azure Policy enforces rules about what can be created. A resource lock stops accidental deletion or changes.","A university only allows resources in approved regions (Policy) and protects the student-records database from deletion (lock).","Policy huweka sheria za nini kinaruhusiwa kuundwa; kufuli hulinda rasilimali isifutwe kwa bahati mbaya.","Policy: what is allowed. RBAC: who can act. Lock: prevent deletion.",2],
["The monitoring family","Azure Monitor collects metrics and logs. Service Health shows Azure-wide incidents. Resource Health shows your own resource. Advisor gives recommendations.","A startup sees slow checkout. Monitor shows the metrics, Resource Health checks one VM, and Service Health shows whether Azure has an incident.","Monitor hukusanya vipimo na kumbukumbu; Service Health huonyesha matatizo ya Azure; Advisor hutoa mapendekezo.","Service Health: Azure-wide. Resource Health: your resource. Advisor: advice, not live status.",2]
];
